[pytest]
# ---------------------------------------------------------------------------
# pytest-bdd configuration
# ---------------------------------------------------------------------------
bdd_features_base_dir = features/

# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
testpaths =
    tests
    features

python_files = test_*.py *_steps.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Django integration (required for model tests and integration tests)
# ---------------------------------------------------------------------------
DJANGO_SETTINGS_MODULE = config.settings.test

# ---------------------------------------------------------------------------
# Markers
# ---------------------------------------------------------------------------
markers =
    unit: Fast, isolated unit tests. No DB, no network.
    integration: End-to-end wiring tests. No DB or real API required unless noted.
    bdd: Behaviour-Driven Development outer-loop scenarios.
    slow: Tests that take > 1s (e.g., real LLM API call, embedding generation).

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning:pytest_bdd

addopts =
    -v
    --tb=short
    --strict-markers

# ---------------------------------------------------------------------------
# Coverage (run with: pytest --cov)
# ---------------------------------------------------------------------------
# To generate HTML report:
#   pytest --cov --cov-report=html
# To enforce threshold (80%):
#   pytest --cov --cov-fail-under=80
